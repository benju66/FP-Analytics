name: Nightly Procore to Supabase Sync

# 1. THE TRIGGERS
on:
  schedule:
    # Runs automatically at 3:00 AM Central Time (8:00 AM UTC) every day
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Adds a "Run workflow" button so you can trigger it manually anytime

jobs:
  build_and_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline Script
        # 2. INJECT SECRETS
        env:
          PROCORE_CLIENT_ID: ${{ secrets.PROCORE_CLIENT_ID }}
          PROCORE_CLIENT_SECRET: ${{ secrets.PROCORE_CLIENT_SECRET }}
          PROCORE_COMPANY_ID: ${{ secrets.PROCORE_COMPANY_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: python procore_pipeline.py
